<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple Jenkins project landing page.">
  <title>Jenkins Project</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #e0e7f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(23 32 51 / 8%);
    }

    .label {
      color: #b45309;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.1;
    }

    p {
      color: #526078;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #b45309;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #92400e;
    }
  </style>
</head>
<body>
  <main>
    <span class="label">Build · Test · Deliver</span>
    <h1>Welcome to Jenkins</h1>
    <p>This project is ready for its next build. Use Jenkins to automate your workflow and keep every change moving.</p>
    <a href="https://www.jenkins.io/doc/">Explore Jenkins documentation</a>
  </main>
</body>
</html>
